<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>{{ title }} – BKM Titelblatt</title>
  <link rel="stylesheet" href="cover-spec.css">
</head>
<body>

  <!-- ============================================================
       BKM TITELBLATT – LAYOUT-DEFINITION v2.0
       
       GRUNDSTRUKTUR:
       ┌──────────────────────────────────────────────┐ 0mm
       │  16:9 FARBKASTEN (210mm × 118.1mm)          │
       │                                              │
       │  ┌─ Logo (18mm/18mm, 42mm breit = 1/5)      │
       │  │                                           │
       │  ├─ Headline (18mm links, 18mm unter Logo)   │
       │  │  ZEILE 1 (kürzer)                         │
       │  │  ZEILE 2 (länger)                         │
       │  │                                           │
       │  ├─ Subheadline (30pt unter Headline)        │
       │  │                                           │
       │  ├─ Fließtext (unter Subheadline)        ┌──┐│
       │  │                                       │KV││ 102.3mm
       │  │                                       │  ││
       ├──┴──────────────────────────────────────┤  ├┤ 118.1mm
       │                                       │  │█│ █ = 8x8mm Kasten
       │  HERO-BILD (210mm × 178.9mm)          │  │█│     (gleiche Farbe
       │                                       └──┘│      wie Farbkasten)
       │                                              │
       │                                              │
       └──────────────────────────────────────────────┘ 297mm
       
       EBENEN (z-index, von hinten nach vorne):
       1. Hero-Bild (unterste Ebene)
       2. 16:9-Farbkasten + 8x8mm Kasten (gleiche Ebene)
       3. Key Visual (immer davor)
       
       VARIANTEN (CSS-Klasse auf .cover):
       - .cover--mannesmann    → Deep Green (#1c4b42)
       - .cover--fachbetriebe  → Transition Green (#287d4b)
       - .cover--homeline      → Pure Green (#4daf46)
       - .cover--proline       → Stone Grey (#494949)
       - .cover--anleitung     → Weiß (#ffffff)
       
       REGELN:
       - Key Visual + Logo = 1/5 Formatbreite (42mm)
       - Headline immer 2-zeilig, Versalien, Zeile 1 < Zeile 2
       - Text Weiß auf dunklem BG, Stone Grey auf weißem BG
       - Key Visual NIEMALS in Code nachbauen!
       - Key Visual rechts bündig, Oberkante bei 102.3mm
       ============================================================ -->

  <div class="cover {{ variant_class }}">

    <!-- HERO-BILD (UNTERSTE EBENE, z-index: 1)
         Position: Y=0 (vollflächig hinter allem)
         Breite: 210mm, Höhe: 297mm
         Fit: cover -->
    <div class="cover__hero">
      <img src="{{ hero_image_path }}" alt="{{ hero_image_alt }}">
    </div>

    <!-- 16:9 FARBKASTEN (z-index: 2)
         Breite: 210mm (vollflächig)
         Höhe: 118.1mm (= 210/16*9)
         Farbe: Je nach Variante -->
    <div class="cover__color-box"></div>

    <!-- 8x8mm FARBKASTEN (z-index: 2, gleiche Ebene wie 16:9-Kasten)
         Position: Rechts bündig, Oberkante an Unterkante des 16:9-Kastens
         Größe: 8mm × 8mm
         Farbe: Gleiche Farbe wie der 16:9-Farbkasten -->
    <div class="cover__corner-box"></div>

    <!-- LOGO
         Position: X=18mm Y=18mm
         Breite: 42mm (1/5 der Formatbreite)
         Variante: Abhängig vom Hintergrund (Kontrast-Regel) -->
    <img class="cover__logo" 
         src="{{ logo_path }}" 
         alt="BKM Mannesmann">

    <!-- HEADLINE
         Position: X=18mm, Y=18mm unter Logo-Unterkante
         Schrift: Unbounded Black (900), 30pt
         Laufweite: -0.025em (-25%)
         Zeilenabstand: 1.25
         Transform: UPPERCASE (Versalien)
         Regel: IMMER 2-zeilig, Zeile 1 kürzer als Zeile 2 -->
    <h1 class="cover__headline">{{ headline }}</h1>

    <!-- SUBHEADLINE
         Position: 30pt (10.6mm) unter Headline Zeile 2 Unterkante
         Schrift: Unbounded Black (900), 12pt
         Laufweite: -0.025em (-25%)
         Transform: none (KEINE Versalien!)
         Verhältnis: Headline:Sub = 2.5:1
         Farbe: Variabel (Lime Green / Deep Green / Pure Green) -->
    <p class="cover__subheadline">{{ subheadline }}</p>

    <!-- FLIESSTEXT
         Position: Unter Subheadline
         Schrift: TT Norms Pro Regular (400), 12pt
         Laufweite: -0.015em (-15%)
         Zeilenabstand: 1.25
         Max-Breite: 107mm
         Max-Zeilen: 3 -->
    <p class="cover__intro">{{ intro_text }}</p>

    <!-- KEY VISUAL
         WICHTIG: Vorgerenderte Bilddatei! NICHT in Code nachbauen!
         Position: Rechts bündig (right=0), Oberkante Y=102.3mm
         Breite: 42mm (1/5 der Formatbreite)
         Variante: on-dark (auf farbigem BG) / on-light (auf weißem BG) -->
    <img class="cover__keyvisual" 
         src="{{ keyvisual_path }}" 
         alt="BKM Key Visual">



  </div>

</body>
</html>
