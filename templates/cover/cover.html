<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>{{ title }} – BKM Titelblatt</title>
  <link rel="stylesheet" href="cover-spec.css">
</head>
<body>

  <!-- ============================================================
       BKM TITELBLATT – LAYOUT-DEFINITION v2.0
       
       GRUNDSTRUKTUR:
       ┌──────────────────────────────────────────────┐ 0mm
       │  16:9 FARBKASTEN (210mm × 118.1mm)          │
       │                                              │
       │  ┌─ Logo (18mm/18mm, 42mm breit = 1/5)      │
       │  │                                           │
       │  ├─ Headline (18mm links, 18mm unter Logo)   │
       │  │  ZEILE 1 (kürzer)                         │
       │  │  ZEILE 2 (länger)                         │
       │  │                                           │
       │  ├─ Subheadline (30pt unter Headline)        │
       │  │                                           │
       │  ├─ Fließtext (unter Subheadline)        ┌──┐│
       │  │                                       │KV││ 102.3mm
       │  │                                       │  ││
       ├──┴──────────────────────────────────────┤  ├┤ 118.1mm
       │                                       │  │█│ █ = 8x8mm Kasten
       │  HERO-BILD (210mm × 178.9mm)          │  │█│     (gleiche Farbe
       │                                       └──┘│      wie Farbkasten)
       │                                              │
       │                                              │
       └──────────────────────────────────────────────┘ 297mm
       
       EBENEN (z-index, von hinten nach vorne):
       1. Hero-Bild (unterste Ebene)
       2. 16:9-Farbkasten + 8x8mm Kasten (gleiche Ebene)
       3. Key Visual (immer davor)
       
       VARIANTEN (CSS-Klasse auf .cover):
       - .cover--mannesmann    → Deep Green (#1c4b42)
       - .cover--fachbetriebe  → Transition Green (#287d4b)
       - .cover--homeline      → Pure Green (#4daf46)
       - .cover--proline       → Stone Grey (#494949)
       - .cover--anleitung     → Weiß (#ffffff)
       
       REGELN:
       - Key Visual + Logo = 1/5 Formatbreite (42mm)
       - Headline immer 2-zeilig, Versalien, Zeile 1 < Zeile 2
       - Text Weiß auf dunklem BG, Stone Grey auf weißem BG
       - Key Visual NIEMALS in Code nachbauen!
       - Key Visual rechts bündig, Oberkante bei 102.3mm
       ============================================================ -->

  <div class="cover {{ variant_class }}">

    <!-- HERO-BILD (UNTERSTE EBENE, z-index: 1)
         Position: Y=0 (vollflächig hinter allem)
         Breite: 210mm, Höhe: 297mm
         Fit: cover -->
    <div class="cover__hero">
      <img src="{{ hero_image_path }}" alt="{{ hero_image_alt }}">
    </div>

    <!-- L-FÖRMIGE FARBFLÄCHE (z-index: 2)
         Besteht aus:
         - 16:9 Farbkasten: 210mm × 118.1mm (vollflächig oben)
         - 8×8mm Erweiterung: rechts unten, bündig an Unterkante
         Zusammen eine einzige L-förmige Fläche.
         Farbe: Je nach Variante -->
    <!-- HERO-GRAFIK (z-index: 2)
         210 x 125 mm. Die PNG bringt die Eckerweiterung mit: unterhalb der
         16:9-Kante bei 118,125 mm ist nur der rechte Zipfel deckend, der Rest
         durchsichtig. Frueher war das ein flacher Farbkasten plus ::after. -->
    <img class="cover__hero-graphic" src="{{ hero_graphic_path }}" alt="">
    {% if hairline %}<div class="cover__hairline"></div>{% endif %}

    <!-- TEXT-CONTENT CONTAINER (Flow-Layout)
         Position: X=18mm Y=18mm (Padding im Container)
         Die Textelemente fließen vertikal mit definierten Abständen.
         Subheadline und Fließtext sind NICHT fest positioniert –
         sie passen sich an die tatsächliche Textlänge an. -->
    <div class="cover__content">

      <!-- LOGO
           Breite: 42mm (1/5 der Formatbreite)
           Variante: Abhängig vom Hintergrund (Kontrast-Regel) -->
      <img class="cover__logo" 
           src="{{ logo_path }}" 
           alt="BKM Mannesmann">

      <!-- SIEGEL (nur Fachbetriebe): rund, ersetzt optisch das Logo.
           Das Logo darueber bleibt im Fluss, damit der Abstand zur Headline
           unveraendert bleibt. -->
      {% if seal_path %}
      <img class="cover__seal" src="{{ seal_path }}" alt="BKM Systempartner">
      {% endif %}

      <!-- HEADLINE
           Schrift: Unbounded Black (900), 30pt, Versalien
           Abstand oben: 18mm (unter Logo)
           Regel: IMMER 2-zeilig, Zeile 1 kürzer als Zeile 2 -->
      <h1 class="cover__headline">{{ headline | safe }}</h1>

      <!-- SUBHEADLINE
           Schrift: Unbounded Black (900), 12pt, keine Versalien
           Abstand oben: 10.6mm (= 30pt Zeichenhöhe)
           Ein- oder zweizeilig je nach Textlänge (KEIN künstlicher Umbruch)
           Farbe: Variabel (Lime Green / Deep Green / Pure Green) -->
      <p class="cover__subheadline">{{ subheadline }}</p>

      <!-- FLIESSTEXT
           Schrift: TT Norms Pro Regular (400), 12pt
           Abstand oben: Immer gleich nah an Subheadline (6mm)
           Ein- bis dreizeilig je nach Textlänge
           Max-Breite: 107mm -->
      <p class="cover__intro">{{ intro_text | safe }}</p>

    </div>

    <!-- KEY VISUAL
         WICHTIG: Vorgerenderte Bilddatei! NICHT in Code nachbauen!
         Position: Rechts bündig (right=0), Oberkante Y=102.3mm
         Breite: 42mm (1/5 der Formatbreite)
         Variante: on-dark (auf farbigem BG) / on-light (auf weißem BG) -->
    <!-- PRODUKT-BADGE (nur bei Home Line und Pro Line Produktbroschüren)
         Position: Linksbündig (18mm), vertikal zentriert auf Unterkante Farbkasten (Y=118.1mm)
         Größe: 61mm × 14.7mm
         Home Line: Silber/Grau
         Pro Line: Gold
         Wird als vorgerenderte Bilddatei platziert -->
    {% if badge_path %}
    <img class="cover__badge" 
         src="{{ badge_path }}" 
         alt="{{ badge_alt }}">
    {% endif %}

    <!-- KEY VISUAL
         WICHTIG: Vorgerenderte Bilddatei! NICHT in Code nachbauen!
         Position: Rechts bündig (right=0), Oberkante Y=102.3mm
         Breite: 42mm (1/5 der Formatbreite) -->
    <img class="cover__keyvisual" 
         src="{{ keyvisual_path }}" 
         alt="BKM Key Visual">

  </div>

</body>
</html>
