name: Broschuere

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Layout- und Inhaltspruefung. Laeuft ohne Abhaengigkeiten, deshalb ohne
  # Installationsschritt - genauso wie die TDS-Pruefung.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Layoutvertrag pruefen
        run: python3 scripts/validate_brochure.py

      # Jede Contentdatei geht an ihren eigenen Pruefer. Vorher lief hier
      # eine Schleife, die alles ausser content/tds* an validate_brochure.py
      # gab - als die Verarbeitungsanleitungen dazukamen, wurden sie gegen
      # den Broschuerenvertrag geprueft und fielen mit "unbekannter Typ
      # 'vorbereitung'" durch. Wer eine neue Familie anlegt, traegt sie
      # hier ein; faellt sie durchs Raster, laeuft sie in den
      # Broschuerenpruefer und scheitert laut. Das ist gewollt.
      - name: Inhalte pruefen
        run: |
          status=0
          shopt -s nullglob
          for file in content/*/content.json; do
            case "$file" in
              content/tds-*)       pruefer=scripts/validate_tds.py ;;
              content/anleitung-*) pruefer=scripts/validate_anleitung.py ;;
              *)                   pruefer=scripts/validate_brochure.py ;;
            esac
            echo "--- $file  ($pruefer)"
            python3 "$pruefer" "$file" || status=1
          done
          exit $status

  # Bau der Demo samt Ausgabepruefung: eingebettete Schriften, Vollstaendigkeit
  # des Textes und Lage im Satzspiegel lassen sich nur am fertigen PDF pruefen.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Systembibliotheken fuer WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Python-Abhaengigkeiten
        run: pip install -r requirements.txt

      - name: Demo bauen und Ausgabe pruefen
        run: python3 scripts/build_pages.py demo

      # Baut alle fuenf Titel und misst im PDF nach, ob Hero-Grafik und Foto
      # dort sitzen, wo cover_geometry in brand.json es vorschreibt. Die CSS
      # wiederholt diese Zahlen; ohne Messung faellt eine Abweichung nicht
      # auf, weil beide Fassungen fuer sich sauber aussehen.
      - name: Titelblaetter bauen und Geometrie pruefen
        run: python3 scripts/build_cover.py

      # Baut die Referenz-Verarbeitungsanleitung und prueft das Ergebnis:
      # Schriften, Vollstaendigkeit ab 3 Zeichen, Seitenzahl, Bildverweise
      # und die Paginierung gegen den Umfang. Siehe docs/ANLEITUNG-LAYOUT.md.
      # Nur bauen - den Inhalt hat der check-Auftrag bereits geprueft.
      # Der Rueckgabewert jeder einzelnen Anleitung zaehlt. Ohne das
      # status=1 traegt die Schleife nur den der letzten nach draussen -
      # eine beanstandete Anleitung mitten in der Reihe waere durchgegangen.
      - name: Verarbeitungsanleitungen bauen
        run: |
          status=0
          for d in content/anleitung-*/; do
            echo "--- $d"
            python3 scripts/build_anleitung.py "$d/content.json" || status=1
          done
          exit $status

      # Die Gegenproben pruefen die Pruefer: jede Regel bekommt einen Fall,
      # der sie anschlagen laesst, und einen, bei dem sie still zu bleiben
      # hat. Sie laufen hier und nicht im check-Auftrag, weil sie WeasyPrint
      # und PyMuPDF brauchen - und nach dem Bau, weil ein Teil von ihnen
      # gegen die eben gebauten Dateien misst.
      - name: Gegenproben
        run: |
          status=0
          for probe in scripts/gegenproben_*.py; do
            echo "--- $probe"
            python3 "$probe" || status=1
          done
          exit $status

      # Die fertigen PDF werden noch einmal von aussen vermessen, als
      # kaeme keines davon aus diesem Repository. Siehe docs/PDF-ABNAHME.md.
      - name: PDF-Abnahme
        run: |
          status=0
          for pdf in output/anleitung/*.pdf; do
            case "$pdf" in *-innenteil.pdf|*-titel.pdf) continue ;; esac
            echo "--- $pdf"
            python3 scripts/pruefe_pdf.py "$pdf" --art anleitung || status=1
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broschuere-demo
          path: output/pages/*.pdf
          if-no-files-found: warn
